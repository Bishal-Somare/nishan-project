<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Staff Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-gray-100">
    <section class="max-w-md mx-auto bg-white p-8 mt-16 rounded-lg shadow-lg">
        <h2 class="text-3xl font-semibold text-center mb-6">Staff Login</h2>
        <form action="database/staff_login.html" method="POST" class="space-y-4">
            <div>
                <label for="username" class="block text-gray-600">Username</label>
                <input type="username" id="username" name="username" class="w-full p-3 border border-gray-300 rounded-md" required>
            </div>
            <div>
                <label for="password" class="block text-gray-600">Password</label>
                <input type="password" id="password" name="password" class="w-full p-3 border border-gray-300 rounded-md" required>
            </div>
            <button type="submit" class="w-full p-3 bg-green-600 text-white rounded-md">Login</button>
        </form>
    </section>
</body>
</html>
